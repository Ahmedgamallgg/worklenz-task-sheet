name: Build, scan, and deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Previously published 40-character commit SHA to roll back to
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: tasksheet-production
  cancel-in-progress: false

env:
  REGISTRY: registry.sevencsolutions.com

jobs:
  build:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.image_tag == '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: frontend
            context: ./worklenz-frontend
            dockerfile: ./worklenz-frontend/Dockerfile
            image: worklenz-task-sheet-frontend
          - component: backend
            context: ./worklenz-backend
            dockerfile: ./worklenz-backend/Dockerfile
            image: worklenz-task-sheet-backend
          - component: database
            context: .
            dockerfile: ./docker/postgres.Dockerfile
            image: worklenz-task-sheet-database
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to the private registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push ${{ matrix.component }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ matrix.image }}:${{ github.sha }}
          build-args: RELEASE_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Scan ${{ matrix.component }} for critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ matrix.image }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL
          trivyignores: .trivyignore

  smoke:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.image_tag == '' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Log in to the private registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Create isolated smoke-test secrets
        shell: bash
        run: |
          {
            echo "IMAGE_TAG=${GITHUB_SHA}"
            echo "APP_DOMAIN=tasks.example.invalid"
            echo "STORAGE_DOMAIN=storage.tasks.example.invalid"
            echo "DB_ADMIN_USER=postgres"
            echo "DB_ADMIN_PASSWORD=$(openssl rand -hex 24)"
            echo "DB_APP_USER=worklenz_backend"
            echo "DB_APP_PASSWORD=$(openssl rand -hex 24)"
            echo "MINIO_ROOT_USER=$(openssl rand -hex 12)"
            echo "MINIO_ROOT_PASSWORD=$(openssl rand -hex 32)"
            echo "S3_ACCESS_KEY_ID=$(openssl rand -hex 12)"
            echo "S3_SECRET_ACCESS_KEY=$(openssl rand -hex 32)"
            echo "SESSION_SECRET=$(openssl rand -hex 32)"
            echo "COOKIE_SECRET=$(openssl rand -hex 32)"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "ENCRYPTION_KEY=$(openssl rand -hex 32)"
            echo "ENCRYPTION_SALT=$(openssl rand -hex 16)"
          } >> "$GITHUB_ENV"

      - name: Start the ephemeral stack
        run: |
          docker network create traefik_default
          docker compose -f compose.production.yml up -d --wait --wait-timeout 300 backend frontend

      - name: Verify frontend and backend
        run: |
          docker compose -f compose.production.yml exec -T frontend wget -qO- http://127.0.0.1:5000/ >/dev/null
          docker compose -f compose.production.yml exec -T backend node -e "fetch('http://127.0.0.1:3000/public/health').then(r => { if (!r.ok) process.exit(1) })"

      - name: Show container state on failure
        if: failure()
        run: |
          docker compose -f compose.production.yml ps --all
          docker compose -f compose.production.yml logs --tail=100

      - name: Remove the ephemeral stack
        if: always()
        run: |
          docker compose -f compose.production.yml down --volumes --remove-orphans
          docker network rm traefik_default || true

  deploy:
    needs: [build, smoke]
    if: ${{ always() && (needs.build.result == 'success' || needs.build.result == 'skipped') && (needs.smoke.result == 'success' || needs.smoke.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://tasks.sevenc.org
    env:
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
    steps:
      - name: Validate immutable image tag
        shell: bash
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]; then
            echo "image_tag must be a full 40-character commit SHA"
            exit 1
          fi

      - name: Trigger the Portainer stack webhook
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: curl --fail --silent --show-error --retry 3 --retry-all-errors --request POST "${PORTAINER_WEBHOOK_URL}?IMAGE_TAG=${IMAGE_TAG}"

      - name: Verify the production deployment
        run: |
          curl --fail --silent --show-error --retry 20 --retry-delay 5 --retry-all-errors https://tasks.sevenc.org/public/health
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors https://tasks.sevenc.org/ >/dev/null
