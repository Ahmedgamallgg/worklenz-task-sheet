<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="/assets/images/7cLogoWithScroll.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#3F54D1" />

    <!-- PWA Meta Tags -->
    <meta name="application-name" content="Seven C's Creative Hub" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Seven C's Creative Hub" />
    <meta name="description" content="Seven C's Creative Hub - Employee Task, Time Tracking & Manager Approval System" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="msapplication-config" content="/browserconfig.xml" />
    <meta name="msapplication-TileColor" content="#3F54D1" />
    <meta name="msapplication-tap-highlight" content="no" />

    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/assets/images/7cLogoWithScrollnail.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/assets/images/7cLogoWithScrollnail.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/7cLogoWithScrollnail.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/assets/images/7cLogoWithScrollnail.png" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Resource hints for better loading performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <link rel="dns-prefetch" href="https://js.hs-scripts.com" />

    <!-- Preload critical resources -->
    <link
      rel="preload"
      href="/locales/en/common.json"
      as="fetch"
      type="application/json"
      crossorigin
    />
    <link
      rel="preload"
      href="/locales/en/auth/login.json"
      as="fetch"
      type="application/json"
      crossorigin
    />
    <link
      rel="preload"
      href="/locales/en/navbar.json"
      as="fetch"
      type="application/json"
      crossorigin
    />

    <!-- Optimized font loading with font-display: swap -->
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <title>Seven C's Creative Hub</title>

    <!-- Environment configuration -->
    <script src="/env-config.js"></script>

    <!-- Analytics Module -->
    <script src="/js/analytics.js" defer></script>
    <!-- Clarity Analytics -->
    <script src="/js/clarity.js" defer></script>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="./src/index.tsx"></script>
    <!-- HubSpot Integration Module -->
    <script src="/js/hubspot.js"></script>
  </body>
</html>
